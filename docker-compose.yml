# =============================================================================
# Credit Default Risk Scoring API
# DDM501 - Lab 1: First ML Product
#
#   docker compose up --build -d
#   docker inspect --format='{{.State.Health.Status}}' credit-risk-api
#
# Train first (python scripts/train_model.py): the model is mounted from
# ./models, it is not inside the image.
# =============================================================================
services:
  api:
    build: .
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      # Read-only: the service must never modify the artifact it serves, and a
      # new model is rolled out by replacing the file and restarting, not by
      # rebuilding the image.
      - ./models:/app/models:ro
    environment:
      MODEL_PATH: /app/models/credit_model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
      # Business thresholds: override from the shell or an .env file without
      # touching the image, e.g. REVIEW_THRESHOLD=0.25 docker compose up -d
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.30}
      DECLINE_THRESHOLD: ${DECLINE_THRESHOLD:-0.60}
    restart: unless-stopped
