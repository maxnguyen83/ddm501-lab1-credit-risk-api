name: Smoke Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Install, train, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify no package needs a compiler
        run: |
          # Every dependency must resolve to a wheel. If this step starts
          # failing, a source-only package crept into requirements.txt and
          # students on Windows and Apple Silicon will not be able to install it.
          pip install --only-binary=:all: --dry-run -r requirements.txt

      - name: Check dataset is present
        run: |
          test -f data/credit_default.csv
          python -c "import pandas as pd; d=pd.read_csv('data/credit_default.csv'); \
            assert d.shape == (30000, 24), d.shape; print('dataset OK', d.shape)"

      - name: Train the model
        run: python scripts/train_model.py

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Build the Docker image
        run: docker build -t credit-risk-api:ci .

      - name: Start the container and hit the API
        run: |
          docker run -d --name api -p 8000:8000 \
            -v "$PWD/models:/app/models:ro" credit-risk-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "API is up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"healthy"'
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"limit_bal":300000,"sex":2,"education":1,"marriage":2,"age":38,
                 "pay_status":[-1,-1,-1,-1,-1,-1],
                 "bill_amt":[12000,11500,11000,10500,10000,9500],
                 "pay_amt":[12000,11500,11000,10500,10000,9500]}' \
            | tee /dev/stderr | grep -q 'default_probability'
          docker stop api
